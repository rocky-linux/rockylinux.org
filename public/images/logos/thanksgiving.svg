  <desc
     id="rlt-icon-description">Rocky Linux Thanksgiving logo with five rounded autumn-colored tail feathers and a small left-facing turkey head. The official green mark retains its original geometry. The background, mountain cutouts, and clearance around the green mark are transparent.</desc>
