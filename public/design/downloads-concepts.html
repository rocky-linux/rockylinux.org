<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloads Page Concepts</title>
<meta name="description" content="Four interactive concepts for the rockylinux.org downloads page redesign, in light and dark mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Red+Hat+Display:wght@700;800&amp;display=swap">
<style>
  :root { --s-bg: #f4f4f5; --s-fg: #09090b; --s-card: #ffffff; --s-mfg: #52525b; --s-border: #d4d4d8; --s-pri: #065f46; --s-on-pri: #ffffff; --s-ring: #047857; --s-warn-bg: #fffbeb; --s-warn-fg: #713f12; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s-bg: #0c0a09; --s-fg: #f2f2f2; --s-card: #1c1917; --s-mfg: #b4b4bb; --s-border: #3f3f46; --s-pri: #34d399; --s-on-pri: #052e16; --s-ring: #34d399; --s-warn-bg: #292524; --s-warn-fg: #fde68a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --s-bg: #0c0a09; --s-fg: #f2f2f2; --s-card: #1c1917; --s-mfg: #b4b4bb; --s-border: #3f3f46; --s-pri: #34d399; --s-on-pri: #052e16; --s-ring: #34d399; --s-warn-bg: #292524; --s-warn-fg: #fde68a; color-scheme: dark; }
  html, body { margin: 0; }
  body { background: var(--s-bg); color: var(--s-fg); font: 16px/1.5 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .shell { position: sticky; top: 0; z-index: 10; background: var(--s-card); border-bottom: 1px solid var(--s-border); }
  .shell-in { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
  .shell h1 { margin: 0; font: 800 20px/1.2 'Red Hat Display', ui-sans-serif, sans-serif; }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .grp-label { font-weight: 600; font-size: 14px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; border: 1px solid var(--s-border); background: var(--s-bg); }
  .seg button { min-height: 44px; min-width: 44px; padding: 8px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--s-fg); font: 500 15px/1.2 'Inter', sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--s-pri); color: var(--s-on-pri); font-weight: 700; }
  .shell :focus-visible, .intro :focus-visible { outline: 3px solid var(--s-ring); outline-offset: 2px; }
  .intro { max-width: 1280px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
  .intro h2 { margin: 0; font: 800 28px/1.2 'Red Hat Display', sans-serif; }
  .intro p { margin: 0; max-width: 80ch; }
  .intro .muted { color: var(--s-mfg); }
  .note { background: var(--s-warn-bg); color: var(--s-warn-fg); border: 1px solid var(--s-border); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
  .stage { padding: 16px 0 48px; display: flex; justify-content: center; }
  .stage.phone .frame { width: 390px; border: 1px solid var(--s-border); border-radius: 24px; overflow: hidden; }
  .frame { width: 100%; max-width: 1280px; }
  @media (max-width: 700px) { .shell { position: static; } }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    body { margin: 0; background: transparent; }
    .rl { --bg: #ffffff; --fg: #09090b; --card: #ffffff; --muted: #f4f4f5; --mfg: #52525b; --border: #e4e4e7; --control: #71717a; --pri: #065f46; --on-pri: #ffffff; --pri-hover: #064e3b; --link: #065f46; --ring: #047857; --brand: #10b981; --soft: #ecfdf5; --soft-fg: #065f46; --shadow: 0 1px 2px rgba(9, 9, 11, 0.06), 0 8px 24px rgba(9, 9, 11, 0.06);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; color: var(--fg); background: var(--bg); container-type: inline-size; box-sizing: border-box; }
    .rl.dark { --bg: #0c0a09; --fg: #f2f2f2; --card: #1c1917; --muted: #262626; --mfg: #b4b4bb; --border: #292524; --control: #8a8a93; --pri: #34d399; --on-pri: #052e16; --pri-hover: #6ee7b7; --link: #6ee7b7; --ring: #34d399; --soft: #022c22; --soft-fg: #6ee7b7; --shadow: none; }
    .rl *, .rl *::before, .rl *::after { box-sizing: border-box; }
    .rl h1, .rl h2, .rl h3, .rl h4 { font-family: 'Red Hat Display', ui-sans-serif, system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; line-height: 1.2; }
    .rl p { margin: 0; }
    .rl a { color: var(--link); text-underline-offset: 3px; }
    .rl a:hover { text-decoration-thickness: 2px; }
    .rl :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
    .rl code, .rl .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; min-width: 44px; padding: 10px 18px; border-radius: 12px; font: 600 16px/1.25 'Inter', ui-sans-serif, system-ui, sans-serif; text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
    .rl a.btn { text-decoration: none; }
    .rl .btn-pri { background: var(--pri); color: var(--on-pri); }
    .rl .btn-pri:hover { background: var(--pri-hover); }
    .rl .btn-out { background: var(--card); color: var(--fg); border-color: var(--control); }
    .rl .btn-out:hover { background: var(--muted); }
    .rl .btn-ghost { background: transparent; color: var(--fg); }
    .rl .btn-ghost:hover { background: var(--muted); }
    .btn-lg { min-height: 56px; padding: 14px 28px; font-size: 18px; }
    .btn-sm { padding: 8px 12px; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
    .muted { color: var(--mfg); }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font: 600 14px/1.6 'Inter', sans-serif; background: var(--soft); color: var(--soft-fg); white-space: nowrap; }
    .badge-out { background: transparent; border: 1px solid var(--control); color: var(--fg); }
    .label { font: 600 14px/1.4 'Inter', sans-serif; color: var(--fg); }
    .selectwrap { position: relative; display: flex; }
    .select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 44px; padding: 8px 40px 8px 12px; border-radius: 12px; border: 1px solid var(--control); background: var(--card); color: var(--fg); font: 500 16px/1.25 'Inter', sans-serif; cursor: pointer; }
    .selectwrap svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--fg); }
    .tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--muted); }
    .tab { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 0; background: transparent; color: var(--mfg); font: 500 16px/1.25 'Inter', sans-serif; cursor: pointer; }
    .tab:hover { color: var(--fg); }
    .tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--card); color: var(--fg); font-weight: 700; box-shadow: inset 0 -3px 0 var(--pri); }
    .code { display: flex; align-items: center; gap: 8px; background: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 4px 4px 4px 14px; font-size: 15px; }
    .code code { flex: 1 1 auto; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 8px 0; color: var(--fg); }
    details.acc { border-top: 1px solid var(--border); }
    details.acc:last-of-type { border-bottom: 1px solid var(--border); }
    details.acc > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; padding: 12px 4px; cursor: pointer; }
    details.acc > summary::-webkit-details-marker { display: none; }
    details.acc > summary .chev { transition: transform 0.2s ease-out; flex: none; }
    details.acc[open] > summary .chev { transform: rotate(180deg); }
    .accbody { padding: 0 4px 24px; display: flex; flex-direction: column; gap: 16px; }
    .linkrow { display: flex; flex-wrap: wrap; gap: 0 24px; }
    .linkrow a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 16px; }
    .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--border); }
    .row:first-child { border-top: 0; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .rl table { border-collapse: collapse; width: 100%; }
    .rl th, .rl td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .rl th { font: 600 14px/1.4 'Inter', sans-serif; color: var(--mfg); }
    .choice { display: flex; flex-direction: column; gap: 8px; padding: 20px; border-radius: 16px; border: 2px solid var(--border); background: var(--card); cursor: pointer; text-align: left; color: var(--fg); font: inherit; min-height: 44px; }
    .choice:hover { border-color: var(--control); }
    .choice[aria-checked="true"], .choice[aria-pressed="true"] { border-color: var(--pri); background: var(--soft); }
    .meter { height: 8px; border-radius: 999px; background: var(--muted); border: 1px solid var(--control); overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--pri); }
    @container (max-width: 760px) {
      .stack-sm { flex-direction: column !important; align-items: stretch !important; }
      .grid-sm { grid-template-columns: minmax(0, 1fr) !important; }
      .row { grid-template-columns: minmax(0, 1fr); }
      .row .btn { width: 100%; }
      .hide-sm { display: none !important; }
      .full-sm { width: 100% !important; }
      .pad-sm { padding-left: 16px !important; padding-right: 16px !important; }
      .h1-sm { font-size: 36px !important; }
      .h2-sm { font-size: 28px !important; }
      .rl .tabs { display: flex; }
      .rl .tabs .tab { flex: 1 1 auto; }
    }
    @media (prefers-reduced-motion: reduce) { .rl * { transition: none !important; } }

/* UseCase */
.choice .ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--muted); color: var(--fg); }
    .choice[aria-pressed="true"] .ico { background: var(--pri); color: var(--on-pri); }
    .choice:disabled { cursor: not-allowed; border-style: dashed; background: transparent; }
/* CompareVersions */
.vcard[data-selected="true"] { border: 2px solid var(--pri); }
    @container (max-width: 760px) {
      .rtable thead { display: none; }
      .rtable tr { display: flex; flex-direction: column; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--border); }
      .rtable td { display: block; padding: 0; border: 0; }
      .rtable td .btn { width: 100%; }
    }
</style>
</head>
<body>
<header class="shell">
  <div class="shell-in">
    <h1>Downloads page concepts</h1>
    <div class="grp" role="group" aria-labelledby="g-concept"><span class="grp-label" id="g-concept">Concept</span><div class="seg" id="concepts"></div></div>
    <div class="grp" role="group" aria-labelledby="g-theme"><span class="grp-label" id="g-theme">Theme</span><div class="seg" id="themes"></div></div>
    <div class="grp" role="group" aria-labelledby="g-width"><span class="grp-label" id="g-width">Width</span><div class="seg" id="widths"></div></div>
  </div>
</header>
<section class="intro" aria-live="polite">
  <h2 id="concept-title"></h2>
  <p id="concept-desc" class="muted"></p>
  <p class="note">Mockup for discussion. Download buttons point at real mirrors and will start full-size downloads. The AWS AMI link is a placeholder.</p>
</section>
<main class="stage" id="stage"><div class="frame" id="frame"></div></main>

<template id="tpl-Recommended">
<div id="top" class="{{rootClass}}" style="width: {{w}}px; min-height: {{minh}}px;">
<header class="pad-sm" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 32px; border-bottom: 1px solid var(--border); background: var(--bg);">
  <a href="#top" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--fg); text-decoration: none; font-family: 'Red Hat Display', ui-sans-serif, sans-serif; font-weight: 800; font-size: 20px;">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" style="fill: var(--brand);"></circle><path d="M5 20 L11 11 L15 16 L18 13 L23 20 Z" style="fill: var(--bg);"></path></svg>
    Rocky Linux
  </a>
  <button type="button" class="btn btn-ghost" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="padding: 10px;">
    <template data-if="dark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
    </template>
    <template data-if="light">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
    </template>
  </button>
</header>

<main class="pad-sm" style="display: flex; flex-direction: column; gap: 56px; max-width: 1200px; margin: 0 auto; padding: 64px 64px 96px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <h1 class="h1-sm" style="font-size: 52px; font-weight: 800;">Download Rocky Linux</h1>
    <p class="muted" style="font-size: 18px; max-width: 60ch;">Free, open, enterprise-grade Linux. Start with the recommended download, or pick another image below.</p>
  </div>

  <section class="card grid-sm pad-sm" aria-labelledby="rec-title" style="display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; padding: 40px;">
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span class="badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg> Recommended for most people</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h2 id="rec-title" class="h2-sm" style="font-size: 44px; font-weight: 800;">Rocky Linux {{latest.cur}}</h2>
        <p class="muted" style="font-size: 17px;">DVD ISO for {{archLabel}} · Supported until {{latest.eol}}</p>
      </div>
      <div class="stack-sm" style="display: flex; flex-wrap: wrap; gap: 12px;">
        <a class="btn btn-pri btn-lg" href="{{dvd.url}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg> Download {{dvd.name}}</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; max-width: 340px;" class="full-sm">
        <label class="label" for="arch-a">Architecture <span class="muted" style="font-weight: 400;">(detected automatically)</span></label>
        <div class="selectwrap">
          <select id="arch-a" class="select" value="{{arch}}" onChange="{{onArch}}">
            <option value="x86_64">AMD/Intel (x86_64)</option>
            <option value="aarch64">ARM (aarch64)</option>
            <option value="ppc64le">PowerPC (ppc64le)</option>
            <option value="s390x">IBM Z (s390x)</option>
            <option value="riscv64">RISC-V (riscv64)</option>
          </select>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>
      <nav aria-label="Download resources" class="linkrow">
        <template data-if="links.torrent"><a href="{{links.torrent}}">Torrent</a></template>
        <a href="{{links.checksum}}">CHECKSUM</a>
        <a href="#verify-a">How to verify</a>
        <a href="https://docs.rockylinux.org/guides/installation/">Installation guide</a>
      </nav>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 24px; border-radius: 12px; background: var(--muted);">
      <h3 style="font-size: 20px; font-weight: 700; padding-bottom: 8px;">Which ISO do I need?</h3>
      <template data-for="isos" data-as="iso">
        <div class="row">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-weight: 700;">{{iso.name}}</span>
            <span class="muted" style="font-size: 15px;">{{iso.desc}}</span>
          </div>
          <a class="btn btn-out btn-sm" href="{{iso.url}}" aria-label="Download {{iso.name}}">Download</a>
        </div>
      </template>
    </div>
  </section>

  <section aria-labelledby="more-title" style="display: flex; flex-direction: column; gap: 16px;">
    <div class="stack-sm" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; flex-wrap: wrap;">
      <h2 id="more-title" class="h2-sm" style="font-size: 32px; font-weight: 700;">More ways to get Rocky Linux</h2>
      <p class="muted">Showing images for {{archLabel}}</p>
    </div>
    <div>
      <template data-if="hasOlder">
        <details class="acc">
          <summary>
            <span style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 20px;">Other supported versions</span>
              <span class="muted" style="font-size: 15px;">{{olderSummary}}</span>
            </span>
            <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </summary>
          <div class="accbody">
            <template data-for="older" data-as="v">
              <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 20px; box-shadow: none;">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline;">
                  <h3 style="font-size: 20px; font-weight: 700;">Rocky Linux {{v.cur}}</h3>
                  <span class="muted" style="font-size: 15px;">Supported until {{v.eol}}</span>
                </div>
                <div class="stack-sm" style="display: flex; flex-wrap: wrap; gap: 8px;">
                  <template data-for="v.isos" data-as="iso">
                    <a class="btn btn-out" href="{{iso.url}}" aria-label="{{iso.aria}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg> {{iso.name}}</a>
                  </template>
                </div>
                <div class="linkrow">
                  <template data-if="v.torrent"><a href="{{v.torrent}}" aria-label="Torrent for Rocky Linux {{v.cur}}">Torrent</a></template>
                  <a href="{{v.checksum}}" aria-label="CHECKSUM for Rocky Linux {{v.cur}}">CHECKSUM</a>
                </div>
              </div>
            </template>
            <p>Need an older point release? Browse <a href="https://dl.rockylinux.org/vault/rocky">archived releases</a>.</p>
          </div>
        </details>
      </template>

      <template data-if="hasCloud">
        <details class="acc">
          <summary>
            <span style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-family: 'Red Hat Display', sans-serif; font-weight: 700; font-size: 20px;">Cloud and virtual machine images</span>
              <span class="muted" style="font-size: 15px;">Generic Cloud (QCOW2), AWS, Google Cloud and Azure</span>
            </span>
            <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </summary>
          <div class="accbody">
            <div class="row" style="padding-top: 0;">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-weight: 700;">Generic Cloud · QCOW2</span>
                <span class="muted" style="font-size: 15px;">For KVM, OpenStack and other cloud-init platforms. <a href="{{cloudChecksum}}" aria-label="CHECKSUM for Generic Cloud image">CHECKSUM</a></span>
              </div>
              <a class="btn btn-out" href="{{cloudUrl}}" aria-label="Download QCOW2 image"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg> Download QCOW2</a>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <span style="font-weight: 700;">Cloud providers</span>
              <div class="stack-sm" style="display: flex; flex-wrap: wrap; gap: 8px;">
                <a class="btn btn-out" href="#aws-amis">AWS AMI list</a>
                <a class="btn btn-out" href="https://console.cloud.google.com/marketplace/browse?filter=partner:Rocky%20Linux">Google Cloud <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg><span class="sr">(opens external site)</span></a>

      b.textContent = it.label;
      b.setAttribute('aria-pressed', String(view[key] === it.id));
      b.addEventListener('click', () => { view[key] = it.id; if (key === 'theme') Object.values(instances).forEach((i) => { i.state.dark = null; }); update(); });
      box.appendChild(b);
    });
  }
  function update() {
    try { localStorage.setItem('rl-dl-concepts', JSON.stringify(view)); } catch (e) {}
    document.documentElement.setAttribute('data-theme', view.theme);
    seg('concepts', CONCEPTS, 'concept');
    seg('themes', [{ id: 'light', label: 'Light' }, { id: 'dark', label: 'Dark' }], 'theme');
    seg('widths', [{ id: 'desktop', label: 'Desktop' }, { id: 'phone', label: 'Phone' }], 'width');
    const c = CONCEPTS.find((x) => x.id === view.concept);
    document.getElementById('concept-title').textContent = c.title;
    document.getElementById('concept-desc').textContent = c.desc;
    draw();
  }

  CONCEPTS.forEach((c) => { instances[c.id] = new window.DC_COMPONENTS[c.id]({}, () => draw()); });
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 100); });
  update();
})();
</script>
</body>
</html>
